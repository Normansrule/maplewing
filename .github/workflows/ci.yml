# Tests the simulator (Python and browser agree), rebuilds the website data and checks it is committed,
# and guards the export-control rule: nothing about Maplewing-3 or Canopy hardware reaches the public site.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Simulator tests (Python vs browser, scope rules)
        run: python -m pytest -q sim
      - name: Website data is up to date
        run: |
          python tools/build_site.py
          git diff --exit-code -- docs/data docs/app docs/models || { echo "Run: make site, then commit"; exit 1; }
      - name: Export-control guard
        run: python tools/check_public.py
      - name: JavaScript parses
        run: for f in docs/assets/js/*.js web/*.js; do node --check "$f"; done
