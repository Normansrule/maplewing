[package]
name = "maplewing"
version = "0.1.0"
description = "Maplewing: ring-tailed, rotor-recovered rockets. Configurator, lineup and printable parts, offline."
authors = ["Maplewing contributors"]
license = "MIT"
repository = "https://github.com/Normansrule/maplewing"
edition = "2021"
rust-version = "1.77"

[lib]
name = "maplewing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "debuginfo"
